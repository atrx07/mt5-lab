name: XAU Router v2 Full Replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-router-v2-full-replay.yml"

permissions:
  contents: read

jobs:
  full-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: xau-lab/requirements.txt

      - name: Install research runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas numba

      - name: Restore canonical 7-day dataset
        working-directory: xau-lab
        run: |
          python tools/restore_dataset.py data/manifests/xau_ticks_7d_2026-09-16_to_2026-09-23.json
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path("xau_ticks_7d.csv")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          print("7d bytes:", p.stat().st_size)
          print("7d sha256:", h)
          PY

      - name: Verify recent archive
        working-directory: xau-lab
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip, hashlib
          p=Path("data/raw/xau_ticks_recent_24h_2026-09-24.csv.gz")
          gz=hashlib.sha256(p.read_bytes()).hexdigest()
          h=hashlib.sha256()
          rows=0
          with gzip.open(p,"rb") as f:
              for chunk in iter(lambda:f.read(1024*1024),b""):
                  h.update(chunk)
          print("recent gz bytes:", p.stat().st_size)
          print("recent gz sha256:", gz)
          print("recent raw sha256:", h.hexdigest())
          PY

      - name: Run full raw-tick Router v2 evaluation
        working-directory: xau-lab
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: "/tmp/numba-cache"
        run: |
          python research/v4_5_router_v2_full_eval.py \
            xau_ticks_7d.csv \
            data/raw/xau_ticks_recent_24h_2026-09-24.csv.gz \
            --random-windows 40 \
            --random-hours 4 \
            --seed 20260925

      - name: Show summary
        if: always()
        working-directory: xau-lab
        run: |
          if [ -f results/simulations/2026-09-25-v4_5-router-v2-full-replay/full_replay_summary.json ]; then
            cat results/simulations/2026-09-25-v4_5-router-v2-full-replay/full_replay_summary.json
          fi

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-router-v2-full-replay
          path: |
            xau-lab/results/simulations/2026-09-25-v4_5-router-v2-full-replay/full_replay_summary.json
            xau-lab/results/simulations/2026-09-25-v4_5-router-v2-full-replay/random_real_windows.csv
          if-no-files-found: warn
          retention-days: 7
