name: XAU State-v2 Walk-forward Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-state-v2-walkforward.yml"

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas numba

      - name: Run frozen walk-forward diagnostic
        continue-on-error: true
        working-directory: xau-lab
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: "/tmp/numba-cache"
        run: |
          set +e
          rm -f state_v2_walkforward_status.txt state_v2_walkforward.log

          python -m py_compile research/v4_5_state_v2_walkforward_predictability.py > state_v2_walkforward.log 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            python research/v4_5_state_v2_walkforward_predictability.py >> state_v2_walkforward.log 2>&1
            status=$?
          fi

          echo "$status" > state_v2_walkforward_status.txt
          cat state_v2_walkforward.log
          exit 0

      - name: Commit successful evidence
        continue-on-error: true
        working-directory: xau-lab
        run: |
          status="$(cat state_v2_walkforward_status.txt 2>/dev/null || echo 999)"
          echo "diagnostic status: $status"
          if [ "$status" != "0" ]; then
            echo "Diagnostic did not complete; no result commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulations/2026-09-25-v4_5-state-v2-walkforward-predictability/
          if git diff --cached --quiet; then
            echo "No new evidence to commit."
          else
            git commit -m "Store XAU state-v2 walk-forward evidence"
            git push origin HEAD:main
          fi

      - name: Upload logs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-state-v2-walkforward
          path: |
            xau-lab/state_v2_walkforward_status.txt
            xau-lab/state_v2_walkforward.log
            xau-lab/results/simulations/2026-09-25-v4_5-state-v2-walkforward-predictability/
          if-no-files-found: warn
          retention-days: 7
