name: XAU Router v3 Priority-Latched Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-router-v3-priority-latched.yml"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research runtime
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas numba

      - name: Run parity-gated Router v3 diagnostic
        continue-on-error: true
        working-directory: xau-lab
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: "/tmp/numba-cache"
        run: |
          set +e
          rm -f router_v3_status.txt router_v3.log

          python tools/restore_dataset.py data/manifests/xau_ticks_7d_2026-09-16_to_2026-09-23.json > router_v3.log 2>&1
          restore_status=$?
          if [ "$restore_status" -ne 0 ]; then
            echo "restore failed with status $restore_status" | tee -a router_v3.log
            echo "$restore_status" > router_v3_status.txt
            cat router_v3.log
            exit 0
          fi

          python -m py_compile research/v4_5_router_v3_priority_latched.py >> router_v3.log 2>&1
          compile_status=$?
          if [ "$compile_status" -ne 0 ]; then
            echo "compile failed with status $compile_status" | tee -a router_v3.log
            echo "$compile_status" > router_v3_status.txt
            cat router_v3.log
            exit 0
          fi

          python research/v4_5_router_v3_priority_latched.py             xau_ticks_7d.csv             data/raw/xau_ticks_recent_24h_2026-09-24.csv.gz             >> router_v3.log 2>&1
          run_status=$?
          echo "$run_status" > router_v3_status.txt
          cat router_v3.log
          exit 0

      - name: Commit successful evidence
        working-directory: xau-lab
        run: |
          status="$(cat router_v3_status.txt 2>/dev/null || echo 999)"
          echo "Router v3 status: $status"
          if [ "$status" != "0" ]; then
            echo "Evaluation did not complete successfully; preserving logs only."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulations/2026-09-25-v4_5-router-v3-priority-latched/
          if git diff --cached --quiet; then
            echo "No new Router v3 evidence to commit."
          else
            git commit -m "Store XAU Router v3 diagnostic evidence"
            git push origin HEAD:main
          fi

      - name: Upload logs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-router-v3-priority-latched
          path: |
            xau-lab/router_v3_status.txt
            xau-lab/router_v3.log
            xau-lab/results/simulations/2026-09-25-v4_5-router-v3-priority-latched/
          if-no-files-found: warn
          retention-days: 7
