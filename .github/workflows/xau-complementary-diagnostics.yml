name: XAU Complementary Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-complementary-diagnostics.yml"

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas numba

      - name: Run frozen diagnostics
        working-directory: xau-lab
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: "/tmp/numba-cache"
        run: |
          set -euo pipefail
          python tools/restore_dataset.py data/manifests/xau_ticks_7d_2026-09-16_to_2026-09-23.json
          python -m py_compile research/v4_5_snapback_foundation.py
          python -m py_compile research/v4_5_state_v2_walkforward_predictability.py

          python research/v4_5_snapback_foundation.py             xau_ticks_7d.csv             data/raw/xau_ticks_recent_24h_2026-09-24.csv.gz

          python research/v4_5_state_v2_walkforward_predictability.py

      - name: Commit evidence
        working-directory: xau-lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             results/simulations/2026-09-25-v4_5-snapback-foundation/             results/simulations/2026-09-25-v4_5-state-v2-walkforward-predictability/
          if git diff --cached --quiet; then
            echo "No new diagnostic evidence."
          else
            git commit -m "Store frozen XAU complementary diagnostics"
            git push origin HEAD:main
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-complementary-diagnostics
          path: |
            xau-lab/results/simulations/2026-09-25-v4_5-snapback-foundation/
            xau-lab/results/simulations/2026-09-25-v4_5-state-v2-walkforward-predictability/
          if-no-files-found: warn
          retention-days: 7
