name: XAU Candidate J Multiseed Random Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-candidate-j-multiseed-random-audit.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas numba
      - name: Run frozen Experiment 47R
        working-directory: xau-lab
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: "/tmp/numba-cache"
        run: |
          set -euo pipefail
          python tools/restore_dataset.py data/manifests/xau_ticks_7d_2026-09-16_to_2026-09-23.json
          python -m py_compile research/v4_5_candidate_j_multiseed_random_audit.py
          python research/v4_5_candidate_j_multiseed_random_audit.py             xau_ticks_7d.csv             data/raw/xau_ticks_recent_24h_2026-09-24.csv.gz
      - name: Commit evidence
        working-directory: xau-lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulations/2026-09-26-v4_5-candidate-j-multiseed-random-audit/
          if git diff --cached --quiet; then
            echo "No new evidence."
          else
            git commit -m "Store Candidate J multi-seed random audit evidence"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
