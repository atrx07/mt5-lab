name: XAU Candidate L Failure Autopsy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-candidate-l-failure-autopsy.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Run rejected-Candidate-L structural autopsy
        working-directory: xau-lab
        run: |
          set -euo pipefail
          python -m py_compile research/v4_5_candidate_l_failure_autopsy.py
          python research/v4_5_candidate_l_failure_autopsy.py
      - name: Commit evidence
        working-directory: xau-lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulations/2026-10-06-v4_5-candidate-l-failure-autopsy/
          if git diff --cached --quiet; then
            echo "No new evidence."
          else
            git commit -m "Store XAU Candidate L failure-autopsy evidence"
            git push origin HEAD:main
          fi
