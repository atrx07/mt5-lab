# rerun after documentation cleanup
name: XAU Candidate F PRIMARY Ratchet

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-candidate-f-primary-ratchet.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas numba
      - name: Run frozen Candidate F full diagnostic
        working-directory: xau-lab
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: "/tmp/numba-cache"
        run: |
          set -euo pipefail
          python tools/restore_dataset.py data/manifests/xau_ticks_7d_2026-09-16_to_2026-09-23.json
          python -m py_compile research/v4_5_candidate_f_primary_ratchet.py
          python research/v4_5_candidate_f_primary_ratchet.py \
            xau_ticks_7d.csv \
            data/raw/xau_ticks_recent_24h_2026-09-24.csv.gz
      - name: Commit evidence
        working-directory: xau-lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulations/2026-09-25-v4_5-candidate-f-primary-ratchet/
          if git diff --cached --quiet; then
            echo "No new evidence."
          else
            git commit -m "Store XAU Candidate F PRIMARY ratchet evidence"
            git push origin HEAD:main
          fi
