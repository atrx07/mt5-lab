name: XAU Current 7D Candidate Eval

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-current7d-candidate-eval.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas numba
      - name: Run current 7-day frozen-candidate diagnostic
        working-directory: xau-lab
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: "/tmp/numba-cache"
        run: |
          set -euo pipefail
          python -m py_compile research/v4_5_current7d_candidate_eval.py
          python research/v4_5_current7d_candidate_eval.py
      - name: Commit evidence
        working-directory: xau-lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulations/2026-10-06-v4_5-current7d-candidate-eval/
          if git diff --cached --quiet; then
            echo "No new evidence."
          else
            git commit -m "Store current 7-day D H J evaluation"
            git push origin HEAD:main
          fi
