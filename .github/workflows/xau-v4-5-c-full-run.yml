name: XAU V4.5-C full run

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/xau-v4-5-c-full-run.yml"
      - "xau-lab/scripts/v4_5_profit_velocity_search.py"

permissions:
  contents: write

jobs:
  run-v4-5-c:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: xau-lab/requirements.txt

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy numba

      - name: Restore canonical raw CSV
        working-directory: xau-lab
        run: |
          python - <<'PY'
          import gzip
          import shutil
          from pathlib import Path

          src = Path("data/raw/xau_ticks_7d_2026-09-16_to_2026-09-23.csv.gz")
          dst = Path("xau_ticks_7d.csv")
          with gzip.open(src, "rb") as fin, dst.open("wb") as fout:
              shutil.copyfileobj(fin, fout)
          print(f"restored {dst} ({dst.stat().st_size} bytes)")
          PY

      - name: Run V4.5-C full lifecycle search
        working-directory: xau-lab
        run: |
          python scripts/v4_5_profit_velocity_search.py xau_ticks_7d.csv

      - name: Remove restored raw CSV
        if: always()
        working-directory: xau-lab
        run: rm -f xau_ticks_7d.csv

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-5-c-profit-velocity
          path: xau-lab/results/simulations/2026-09-24-v4_5-c-profit-velocity/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit canonical result bundle
        run: |
          git config user.name "xau-lab-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xau-lab/results/simulations/2026-09-24-v4_5-c-profit-velocity/
          if git diff --cached --quiet; then
            echo "No generated result changes to commit."
            exit 0
          fi
          git commit -m "Record V4.5-C full replay results"
          git push origin HEAD:main
