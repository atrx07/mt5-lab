name: XAU Independent Opportunity Atlas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xau-independent-opportunity-atlas.yml"

permissions:
  contents: write

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research runtime
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas numba

      - name: Run opportunity atlas
        continue-on-error: true
        working-directory: xau-lab
        env:
          PYTHONUNBUFFERED: "1"
          NUMBA_CACHE_DIR: "/tmp/numba-cache"
        run: |
          set +e
          rm -f opportunity_atlas_status.txt opportunity_atlas.log

          python tools/restore_dataset.py data/manifests/xau_ticks_7d_2026-09-16_to_2026-09-23.json > opportunity_atlas.log 2>&1
          restore_status=$?
          if [ "$restore_status" -ne 0 ]; then
            echo "restore failed with status $restore_status" | tee -a opportunity_atlas.log
            echo "$restore_status" > opportunity_atlas_status.txt
            cat opportunity_atlas.log
            exit 0
          fi

          python -m py_compile research/v4_5_independent_opportunity_atlas.py >> opportunity_atlas.log 2>&1
          compile_status=$?
          if [ "$compile_status" -ne 0 ]; then
            echo "compile failed with status $compile_status" | tee -a opportunity_atlas.log
            echo "$compile_status" > opportunity_atlas_status.txt
            cat opportunity_atlas.log
            exit 0
          fi

          python research/v4_5_independent_opportunity_atlas.py             xau_ticks_7d.csv             data/raw/xau_ticks_recent_24h_2026-09-24.csv.gz             >> opportunity_atlas.log 2>&1
          run_status=$?
          echo "$run_status" > opportunity_atlas_status.txt
          cat opportunity_atlas.log
          exit 0

      - name: Commit successful evidence
        working-directory: xau-lab
        run: |
          status="$(cat opportunity_atlas_status.txt 2>/dev/null || echo 999)"
          echo "atlas status: $status"
          if [ "$status" != "0" ]; then
            echo "Atlas did not complete successfully; preserving logs only."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/simulations/2026-09-25-v4_5-independent-opportunity-atlas/
          if git diff --cached --quiet; then
            echo "No new atlas evidence to commit."
          else
            git commit -m "Store XAU independent opportunity atlas evidence"
            git push origin HEAD:main
          fi

      - name: Upload logs and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xau-independent-opportunity-atlas
          path: |
            xau-lab/opportunity_atlas_status.txt
            xau-lab/opportunity_atlas.log
            xau-lab/results/simulations/2026-09-25-v4_5-independent-opportunity-atlas/
          if-no-files-found: warn
          retention-days: 7
